[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptscreen"
version = "0.1.0"
description = "A guardrail for local LLM I/O: screen inputs and outputs against rules and detectors, redact secrets and PII, and keep an audit trail — every decision with its reasons."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nirry" }]
keywords = ["llm", "guardrails", "prompt-injection", "security", "pii", "secrets", "redaction", "moderation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
promptscreen = "promptscreen.cli:main"

[project.urls]
Homepage = "https://nirry.net"
Source = "https://github.com/nirry-dev/promptscreen"

[tool.hatch.build.targets.wheel]
packages = ["promptscreen"]
